[project]
name = "speech-service"
version = "0.1.0"
description = "Микросервис распознавания (GigaAM STT) и синтеза речи (Silero TTS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pydub>=0.25.1",
    "structlog>=24.1.0",
    "silero>=0.4.1",
    # Silero VAD отдаётся отдельным пакетом (в "silero" его нет).
    "silero-vad>=6.1.0",
    "gigaam>=0.1.0",
    "edge-tts>=6.1.9",
    "sounddevice>=0.5.6",
    "requests>=2.34.2",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
