[project]
name = "speech-service"
version = "0.1.0"
description = "Микросервис распознавания (GigaAM STT) и синтеза речи (Silero TTS)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "pydub>=0.25.1",
    "structlog>=24.1.0",
    "silero>=0.4.1",
    # Silero VAD отдаётся отдельным пакетом (в "silero" его нет).
    "silero-vad>=6.1.0",
    # GigaAM из master-ветки GitHub: PyPI-релиз 0.1.0 поддерживает только
    # v1/v2 (без v3 и multilingual). Наш registry использует v3_e2e_* и
    # multilingual_* модели, поэтому нужна версия из репозитория.
    "gigaam @ git+https://github.com/salute-developers/GigaAM.git@7447938d791c4f3e643386ee22c33777004293a5",
    "edge-tts>=6.1.9",
    "sounddevice>=0.5.6",
    "requests>=2.34.2",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
# Локальный rootdir для pytest: без этого pytest поднимается выше и находит
# [tool.pytest.ini_options] из корневого pyproject.toml проекта taxi-v3,
# которое подставляет в sys.path корень основного проекта.
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
