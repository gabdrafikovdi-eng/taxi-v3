;==============================================================================
; taxi-v3 telephony — dialplan (МИНИМАЛЬНЫЙ).
; Вся логика звонка — в Stasis-приложении telephony-service (ARI).
; Dialplan только маршрутизирует входящие с GoIP в приложение.
;==============================================================================

[general]
static=yes
writeprotect=yes

;------------------------------------------------------------------------------
; Входящие вызовы с GoIP4 (endpoint goip4 -> context=from-goip).
; ВАЖНО: GoIP шлёт INVITE на свой SIP-идентификатор (Phone Number = goip4),
; Request-URI = sip:goip4@<host> — EXTEN будет 'goip4', а не номер абонента.
; Номер звонящего доступен через CALLERID(num) / Remote-Party-ID.
; Матчим и идентификатор goip4, и числовые DID (если GoIP перенастроить).
; Answer выполняет telephony-service через ARI: если оркестратор недоступен,
; звонок не принимается (абонент слышит КПВ), а не тишину.
;------------------------------------------------------------------------------
[from-goip]
exten => goip4,1,NoOp(Inbound GSM: from=${CALLERID(num)} to=${EXTEN})
 same => n,Stasis(taxi)
 same => n,Hangup()
exten => _X.,1,NoOp(Inbound GSM: from=${CALLERID(num)} to=${EXTEN})
 same => n,Stasis(taxi)
 same => n,Hangup()

;------------------------------------------------------------------------------
; Тестовый контекст (исходящий с GoIP / локальные тесты):
;   600 — эхо-тест (проверка RTP/audio в обе стороны без telephony-service);
;   601 — вход в Stasis-приложение (проверка ARI-pipeline).
;------------------------------------------------------------------------------
[test]
exten => 600,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()

exten => 601,1,NoOp(Stasis test)
 same => n,Stasis(taxi)
 same => n,Hangup()
