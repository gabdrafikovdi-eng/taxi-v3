;==============================================================================
; taxi-v3 telephony — Asterisk REST Interface (ARI)
; Шаблон: @@ARI_USERNAME@@ / @@ARI_PASSWORD@@ рендерятся при старте контейнера
; из переменных окружения (секреты не хранятся в репозитории).
; Security: порт 8088 НЕ публикуется наружу без необходимости; в production
; ARI доступен только внутри private/VPN-сети или по localhost.
;==============================================================================

[general]
enabled=yes
pretty=yes

[@@ARI_USERNAME@@]
type=user
read_only=no
password=@@ARI_PASSWORD@@
password_format=plain
