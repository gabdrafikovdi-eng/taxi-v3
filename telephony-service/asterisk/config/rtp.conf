;==============================================================================
; taxi-v3 telephony — RTP
;
; Узкий ВЫДЕЛЕННЫЙ диапазон для Asterisk: 10000-10100/UDP
;   * в Docker публикуется 1:1 (см. docker-compose.yml) — без этого GoIP не
;     получит медиа;
;   * в production открыть только на VPN/private-интерфейсе;
;   * telephony-service (external media) слушает ОТДЕЛЬНЫЙ диапазон
;     18000-18050 — пересечений нет.
;==============================================================================

[general]
rtpstart=10000
rtpend=10100
strictrtp=yes
rtpchecksums=yes
dscp=EF
