;==============================================================================
; taxi-v3 telephony — PJSIP (Asterisk 22)
;
; Это ШАБЛОН: секреты подставляются при старте контейнера
; (asterisk/scripts/render-config.sh).
; Плейсхолдеры значений: MEDIA_FORMAT (ulaw/alaw), SIP-пароль GoIP4, IP GoIP4.
; Условные секции (digest-аутентификация против IP-identification) управляются
; переменной GOIP_AUTH_MODE через render-config.sh.
;==============================================================================

[global]
type=global
; Порядок сопоставления входящих SIP-запросов с endpoint'ами.
; ip       — по источнику (identify; production, GoIP в VPN со стабильным IP);
; username — по From/Authorization (dev: GoIP за Docker NAT, IP не сохраняется).
; Анонимные вызовы не принимаются (anonymous identifier отсутствует намеренно).
endpoint_identifier_order=ip,username

[system]
type=system
timers=t1min

;------------------------------------------------------------------------------
; Транспорт SIP 5060/UDP.
; Security: в production bind на VPN/private-интерфейс (bind=<vpn-ip>:5060)
; и/или firewall. Публичный доступ к SIP запрещён.
;
; NAT: Asterisk живёт в Docker-bridge за публикацией портов на хосте.
; Абоненты вне хоста (GoIP в LAN/VPN) должны получать в Via/Contact/SDP
; внешний адрес хоста (ASTERISK_PUBLIC_IP) и опубликованные RTP-порты,
; иначе медиа не дойдёт (GoIP не умеет маршрутизировать 172.x).
;
; ВАЖНО: local_net должен содержать ТОЛЬКО реально локальные адреса.
; Docker NAT подменяет source IP внешних абонентов на gateway docker-сети
; (например 172.22.0.1) — если он попадает в local_net, Asterisk решит,
; что NAT нет, и оставит в SDP внутренний адрес контейнера (RTP не дойдёт).
; docker-сети (172.16/12) сюда включать НЕЛЬЗЯ.
; Если ASTERISK_PUBLIC_IP не задан, строки external_*/local_net удаляются
; при рендере (direct-routing, без NAT-коррекции).
;------------------------------------------------------------------------------
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=127.0.0.0/8
external_media_address=@@ASTERISK_PUBLIC_IP@@
external_signaling_address=@@ASTERISK_PUBLIC_IP@@

;------------------------------------------------------------------------------
; GoIP4 — GSM-шлюз (SIM Beeline).
; dev:  GoIP -> Mac:5060 (SIP User ID = goip4, password = GOIP_SIP_PASSWORD);
; prod: GoIP -> VPN-IP сервера, GOIP_AUTH_MODE=ip (identify по IP).
;------------------------------------------------------------------------------
[goip4]
type=endpoint
context=from-goip
transport=transport-udp
disallow=all
allow=@@MEDIA_FORMAT@@
dtmf_mode=rfc4733
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; media_address форсирует c= в SDP сессии с GoIP. external_media_address на
; транспорте НЕ применяется к 200 OK входящих вызовов (UAS) в этой версии
; Asterisk — без media_address GoIP получает в SDP внутренний адрес контейнера
; (172.x) и RTP не доходит. Задавать только если ASTERISK_PUBLIC_IP определён.
@@IF_MEDIA@@
media_address=@@ASTERISK_PUBLIC_IP@@
@@ENDIF_MEDIA@@
@@IF_DIGEST@@
auth=goip4auth
aors=goip4
@@ENDIF_DIGEST@@

@@IF_DIGEST@@
[goip4auth]
type=auth
auth_type=userpass
username=goip4
password=@@GOIP_SIP_PASSWORD@@
@@ENDIF_DIGEST@@

[goip4]
type=aor
max_contacts=2
remove_existing=yes
qualify_frequency=60

;------------------------------------------------------------------------------
; ТЕСТОВЫЙ endpoint (self-loop): Asterisk вызывает сам себя (127.0.0.1).
; Используется для проверки ARI/media-pipeline без реального GSM-звонка:
;   asterisk -rx "channel originate PJSIP/loopback/601 application Playback(demo-congrats)"
; Безопасно (только localhost), в production можно удалить.
;------------------------------------------------------------------------------
[loopback]
type=endpoint
context=test
transport=transport-udp
disallow=all
allow=@@MEDIA_FORMAT@@
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=loopback

[loopback]
type=aor
contact=sip:127.0.0.1:5060

[identify-loopback]
type=identify
endpoint=loopback
match=127.0.0.1

@@IF_IP@@
; Identification по IP GoIP4 (production: адрес в VPN-сети).
[identify-goip4]
type=identify
endpoint=goip4
match=@@GOIP_HOST@@
@@ENDIF_IP@@
