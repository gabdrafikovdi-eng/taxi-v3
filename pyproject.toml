[project]
name = "taxi-v3"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.0",
    "asyncpg>=0.31.0",
    "greenlet>=3.5.4",
    "openai>=2.53.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0.51",
]
[tool.ruff.lint]
ignore = ["I001"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "openai>=1.0.0",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Общий event loop на всю сессию: глобальный async engine (asyncpg) не должен
# переживать смену циклов между тестами, иначе соединения из пула становятся
# невалидными ("cannot perform operation: another operation is in progress").
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
